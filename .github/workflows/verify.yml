name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Switch to npm ci once a lockfile has been generated and committed in a networked environment.
      - run: npm install
      - run: npm run cli:check
      - run: npm run verify
