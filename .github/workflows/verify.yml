name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps git+https://github.com/genlayerlabs/genlayer-testing-suite@75a5bcde75582734caaf210b9ebadab358fd45cb
      - run: npm ci
      - run: npm run cli
      - run: mkdir -p "$HOME/.cache/gltest-direct" && curl --fail --location --retry 3 https://github.com/genlayerlabs/genvm/releases/download/v0.2.12/genvm-universal.tar.xz --output "$HOME/.cache/gltest-direct/genvm-universal-v0.2.12.tar.xz"
      - run: npm run verify
      - run: npm run test:mutation
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
