name: MARGIN Connect release gate (example)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./actions/margin-release-gate
        with:
          policy-file: .margin/policy.json
          artifact-path: dist/release.tar.gz
          margin-address: ${{ vars.MARGIN_CONTRACT_ADDRESS }}
          consumer-address: ${{ vars.MARGIN_CONSUMER_ADDRESS }}
